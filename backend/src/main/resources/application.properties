# =============================================
# CyberEye Backend – Application Properties
# =============================================

server.port=8080
spring.application.name=cybereye-backend

# ── H2 In-Memory Database (Default – no setup needed) ──
spring.datasource.url=jdbc:h2:mem:cybereye;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop

# ── PostgreSQL (Uncomment below and comment H2 above to use PostgreSQL) ──
# spring.datasource.url=jdbc:postgresql://localhost:5432/cybereye
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ── JPA ──
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT Configuration ──
jwt.secret=Y3liZXJleWUtand0LXN1cGVyLXNlY3JldC1rZXktMjAyNC1sb25nLWVub3VnaA==
jwt.expiration=86400000

# ── ML Service ──
ml.service.url=https://cyber-ai-lite-5.onrender.com

# ── CORS ──
cors.allowed.origins=http://localhost:5173

# ── Multipart (image upload) ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ──
logging.level.com.cybereye=INFO
logging.level.org.springframework.security=WARN
